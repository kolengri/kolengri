<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="336" viewBox="0 0 1200 336" role="img" aria-labelledby="title description">
  <title id="title">Gregory Kolens — Senior AI Product Engineer</title>
  <desc id="description">Dark dossier-style banner with a terminal signal mark, gold accents, and Gregory Kolens' professional title.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040711"/>
      <stop offset="1" stop-color="#0d1425"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#526384" stroke-opacity=".1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="334" rx="18" fill="url(#background)" stroke="#2b3550" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="332" rx="17" fill="url(#grid)"/>
  <path d="M0 272h1200" stroke="#2b3550"/>
  <path d="M790 0v336" stroke="#2b3550" stroke-opacity=".7"/>

  <circle cx="62" cy="52" r="6" fill="#78bca4" filter="url(#glow)"/>
  <text x="80" y="57" fill="#e4bd63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="3">IDENTITY / VERIFIED</text>

  <text x="58" y="145" fill="#f1e7cf" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="750" letter-spacing="-1">GREGORY KOLENS</text>
  <text x="60" y="190" fill="#bdc6d8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" letter-spacing="4">SENIOR AI PRODUCT ENGINEER</text>
  <text x="60" y="232" fill="#8491a8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">AI systems · full-stack products · technical leadership</text>

  <text x="58" y="305" fill="#8491a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2">PRG / 2001</text>
  <text x="220" y="305" fill="#78bca4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2">13+ YEARS IN PRODUCTION</text>
  <text x="510" y="305" fill="#8491a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2">50.0755° N / 14.4378° E</text>

  <g transform="translate(988 135)">
    <circle r="92" fill="none" stroke="#e4bd63" stroke-width="3" stroke-opacity=".82"/>
    <circle r="70" fill="none" stroke="#526384" stroke-opacity=".45"/>
    <path d="M-42-38 5 0l-47 38" fill="none" stroke="#f1e7cf" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M17 40h45" stroke="#78bca4" stroke-width="13" stroke-linecap="square"/>
    <circle cx="70" cy="-59" r="9" fill="#78bca4" stroke="#040711" stroke-width="5" filter="url(#glow)"/>
  </g>

  <text x="835" y="305" fill="#8491a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2">ENGINEER / BUILDER / LEAD</text>
</svg>
